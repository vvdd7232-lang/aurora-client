plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.17.21'
    id 'maven-publish'
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}
java {
    // Flexible: use whatever JDK is present (17 or 21). Minecraft 1.21.11 officially
    // requires Java 21 at runtime, but JDK 17 can still produce bytecode that targets 21
    // thanks to --release 21 when JDK 21 is available. On JDK 17 we compile as 17 and the
    // produced classes still run on 21 because Fabric/Loom only uses javac for our sources.
    toolchain {
        languageVersion = JavaLanguageVersion.of(
            Integer.parseInt(System.getProperty("java.version").split("\\.")[0]) >= 21 ? "21" : "17")
    }
    withSourcesJar()
}

// Mixin annotation processing handled automatically by fabric-loom when mixin config is present.
tasks.withType(JavaCompile).configureEach {
    options.release = 21
}
